<style>
:root{
  --hh:max(56px,calc(100vh / 12));
  --sh:52px;
  --bg:#ffffff;--card:#ffffff;--text:#111827;--sub:#6b7280;--border:#e5e7eb;--input:#f5f6f8;
  --primary:#2563eb;--link:#1d4ed8;--hover:rgba(0,0,0,.07);--shadow:0 2px 12px rgba(0,0,0,.12);
}
body.dark{
  --bg:#000000;--card:#111318;--text:#f3f4f6;--sub:#9ca3af;--border:#2a2e37;--input:#1a1d24;
  --primary:#3b82f6;--link:#6ea8ff;--hover:rgba(255,255,255,.12);--shadow:0 2px 12px rgba(255,255,255,.08);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6;transition:background .2s,color .2s}
button,input{font:inherit;color:inherit}
a{color:var(--link)}

/* ===== ヘッダー ===== */
#header{position:fixed;top:0;left:0;right:0;height:var(--hh);display:grid;grid-template-columns:1fr minmax(200px,560px) 1fr;align-items:center;gap:12px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--border);z-index:100;transition:transform .3s ease,opacity .3s ease}
#header.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
.hdr-left{display:flex;align-items:center;gap:6px;min-width:0}
.hdr-right{display:flex;justify-content:flex-end;gap:2px}
.logo{display:block;line-height:0;flex:none}
.logo img{display:block;height:calc(var(--hh) * 0.7);width:auto;max-width:34vw;border-radius:8px;background:#fff}
.logo-big{display:block;width:min(520px,84vw);height:auto;border-radius:12px;background:#fff}
.icon-btn{width:40px;height:40px;border:0;background:transparent;color:var(--text);border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;text-decoration:none;flex:none}
.icon-btn:hover:not(:disabled){background:var(--hover)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn.active{background:var(--hover);color:#dc2626}
.icon-btn.danger:hover{color:#dc2626}
.icon-btn.star.on{color:#f59e0b}
.icon-btn.star:hover{color:#f59e0b}

/* ===== 検索バー ===== */
.search-wrap{position:relative;width:100%}
.search-wrap.big{width:min(720px,92vw)}
.search-box{position:relative;display:flex;align-items:center;height:40px;background:var(--input);border:1px solid var(--border);border-radius:999px;padding:0 6px}
.search-wrap.big .search-box{height:58px;padding:0 10px}
.s-btn{width:34px;height:34px;border:0;background:transparent;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--sub);flex:none}
.s-btn:hover{background:var(--hover);color:var(--text)}
.s-input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 8px;font-size:15px}
.search-wrap.big .s-input{font-size:18px}
.s-dd{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:200}
.dd-row{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 16px;min-height:40px;cursor:pointer}
.dd-row:hover{background:var(--hover)}
.dd-w{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-none{padding:10px 16px;color:var(--sub);font-size:14px}
.dd-x{width:28px;height:28px;border:0;background:transparent;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--sub);flex:none}
.dd-x:hover{background:var(--hover);color:var(--text)}

/* ===== サブバー（ページ作成時） ===== */
.subbar{position:fixed;left:0;right:0;top:var(--hh);height:var(--sh);display:flex;justify-content:center;align-items:center;gap:8px;padding:0 10px;background:var(--card);border-bottom:1px solid var(--border);z-index:90;transition:top .3s ease;overflow-x:auto}
body.hdr-hidden .subbar{top:0}
.tb{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer;font-size:14px;white-space:nowrap}
.tb:hover:not(:disabled){background:var(--hover)}
.tb:disabled{opacity:.35;cursor:default}
.tb[data-act=tb-url] svg{color:#2563eb}.tb[data-act=tb-image] svg{color:#10b981}.tb[data-act=tb-audio] svg{color:#a855f7}.tb[data-act=tb-color] svg{color:#f59e0b}
.tb-sep{width:1px;height:24px;background:var(--border)}

/* ===== ページ共通 ===== */
#view{padding-top:var(--hh);min-height:100vh}
body.editing #view{padding-top:calc(var(--hh) + var(--sh))}
.page{max-width:900px;margin:0 auto;padding:24px 20px 100px}
.page.wide{max-width:1120px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.head-btns{display:flex;gap:8px}
.h1{font-size:28px;margin:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.card.pad{padding:22px}
.empty{text-align:center;color:var(--sub);padding:60px 0;font-size:18px}
.empty-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-block;padding:8px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;text-decoration:none;font-size:15px}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--primary);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08);background:var(--primary)}
.btn.danger{background:#dc2626;color:#fff;border-color:transparent}
.btn.danger:hover:not(:disabled){filter:brightness(1.08);background:#dc2626}

/* ===== ホーム ===== */
.home-top{height:calc(100vh - var(--hh));min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 16px}
.count{background:none;border:0;cursor:pointer;font-size:16px;text-decoration:underline;padding:6px 14px;border-radius:8px}
.count:hover{background:var(--hover)}
.all-list{max-width:640px;margin:0 auto;padding:16px 20px 100px;scroll-margin-top:8px}
.all-list ul{list-style:none;margin:0;padding:0}
.all-list li a{display:block;padding:11px 12px;border-bottom:1px solid var(--border);text-decoration:none}
.all-list li a:hover{background:var(--hover)}

/* ===== 検索結果 ===== */
.count-note{color:var(--sub);margin:6px 0 10px}
.result{padding:14px 0;border-bottom:1px solid var(--border)}
.r-row{display:flex;align-items:center;gap:2px}
.r-title{font-size:20px;font-weight:600;text-decoration:none;color:var(--link);min-width:0;overflow-wrap:anywhere;margin-right:6px}
.r-title:hover{text-decoration:underline}
.r-url{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-snip{color:var(--sub);font-size:14px;margin-top:4px}

/* ===== 記事表示 ===== */
.art-head{display:flex;align-items:center;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.art-head .h1{margin-right:8px}
.art-wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.art-wrap.no-toc{grid-template-columns:minmax(0,1fr)}
.toc{position:sticky;top:calc(var(--hh) + 16px);border:1px solid var(--border);background:var(--input);border-radius:12px;padding:14px 18px;transition:top .3s ease}
body.hdr-hidden .toc{top:16px}
.toc-t{font-weight:700}
.toc ol{margin:6px 0 0;padding-left:22px}
.toc-link{background:none;border:0;color:var(--link);cursor:pointer;padding:3px 0;text-align:left}
.toc-link:hover{text-decoration:underline}
.v-sec{scroll-margin-top:calc(var(--hh) + 12px)}
.v-sec:first-child h2{margin-top:0}
.v-sec h2{font-size:22px;border-bottom:1px solid var(--border);padding-bottom:6px;margin:28px 0 12px}
.v-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start}
.v-grid.full{grid-template-columns:1fr}
.rich-view,.rich{white-space:pre-wrap;word-break:break-word;line-height:1.8}
.v-media figure{margin:0 0 14px}
.v-media img{max-width:100%;width:100%;border-radius:10px;display:block}
.v-media figcaption,.figcap{font-size:13px;color:var(--sub);font-style:italic;text-align:center;margin-top:4px}
.v-aud{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:14px;background:var(--input)}
.v-aud audio,.media.aud audio{width:100%}
.fname{font-size:12px;color:var(--sub);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:26px}
.rich a,.rich-view a{color:var(--link)!important;text-decoration:underline!important}
body.dark .rich [style*="rgb(0, 0, 0)"],body.dark .rich-view [style*="rgb(0, 0, 0)"],
body.dark .rich font[color="#000000"],body.dark .rich-view font[color="#000000"]{color:var(--text)!important}

/* ===== エディタ ===== */
.field-label{font-size:13px;font-weight:700;color:var(--sub);margin:10px 4px 6px}
.title-input,.sec-heading,.m-input,.cap-input{width:100%;border:1px solid var(--border);background:var(--input);border-radius:10px;padding:10px 12px;outline:0}
.title-input{font-size:22px;font-weight:700}
.title-input:focus,.sec-heading:focus,.m-input:focus,.cap-input:focus,.rich:focus{border-color:var(--primary)}
.section{margin-top:20px}
.sec-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec-no{font-size:13px;font-weight:700;color:var(--primary)}
.sec-del{width:30px;height:30px;border:0;background:transparent;border-radius:50%;cursor:pointer;color:var(--sub);display:grid;place-items:center}
.sec-del:hover{background:var(--hover);color:#dc2626}
.sec-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:stretch}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 6px}
.lbl:first-child{margin-top:0}
.rich{min-height:170px;padding:12px;border:1px solid var(--border);background:var(--input);border-radius:10px;outline:0}
.sec-right{border:1px solid var(--border);background:var(--input);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.media-empty{margin:auto;color:var(--sub);font-size:13px;opacity:.7}
.slot{border:2px dashed var(--primary);color:var(--primary);background:transparent;border-radius:10px;padding:10px;cursor:pointer}
.slot:hover{background:var(--hover)}
.media{position:relative}
.img-wrap{position:relative}
.img-wrap img{width:100%;display:block;border-radius:10px;cursor:pointer}
.m-del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:#dc2626;color:#fff;border:0;display:grid;place-items:center;cursor:pointer;padding:0;z-index:2}
.m-cap{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.media.img.selected .m-cap{display:block}
.media.img.has-cap .m-cap{display:none!important}
.cap-input{margin-top:6px;font-size:13px;font-style:italic;text-align:center}
.media.aud{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px}
.add-sec{margin-top:20px;width:100%;padding:18px;border:2px dashed var(--border);background:transparent;color:var(--sub);border-radius:16px;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
.add-sec:hover{background:var(--hover)}
.place-banner{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:150;background:var(--primary);color:#fff;padding:10px 18px;border-radius:999px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:94vw}
.place-banner .btn{background:#fff;color:#111;padding:4px 14px}

/* ===== 履歴 / ブックマーク / 設定 ===== */
.h-group{margin-bottom:22px}
.h-date{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:6px 0;border-bottom:2px solid var(--border)}
.h-group ul,.bm-list{list-style:none;margin:0;padding:0}
.h-item{display:flex;align-items:center;gap:10px;padding:2px 0}
.h-word{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:8px 6px;border-radius:8px;text-align:left;text-decoration:none;color:var(--text)}
.h-word:hover{background:var(--hover)}
.h-word svg{color:var(--sub)}
.h-word .bs svg{color:#f59e0b}
.bs{display:inline-grid}
.chk{width:20px;height:20px;accent-color:#dc2626;cursor:pointer;flex:none}
.sort-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.sort-opt.on{border-color:var(--primary);color:var(--primary);font-weight:700}
.set-t{font-weight:700;margin-bottom:12px}
.theme-opts{display:flex;gap:14px;flex-wrap:wrap}
.theme-opt{display:flex;align-items:center;gap:10px;padding:14px 26px;border:2px solid var(--border);border-radius:14px;background:var(--card);cursor:pointer;font-size:16px}
.theme-opt.on{border-color:var(--primary)}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid #888;display:inline-block}
.sw.light{background:#fff}.sw.dark{background:#000}
.hint{color:var(--sub);font-size:13px;margin:14px 0 0}

/* ===== モーダル / トースト ===== */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:300;padding:12px}
.modal-box{position:relative;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:18px;padding:24px;width:min(440px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal-box.square{min-height:min(440px,80vw);display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding-top:50px}
.modal-box .modal-x{position:absolute;top:8px;right:8px}
.modal-box h3{margin:0 0 8px}
.modal-box p{margin:0 0 18px;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.u-res{margin-top:8px;max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.u-item{text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--link)}
.u-item:hover{background:var(--hover)}
.u-none{color:var(--sub);padding:8px 10px;font-size:14px}
.color-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:auto 0}
.color-btn{padding:18px 0;border-radius:12px;border:1px solid #555;font-size:18px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);background:#374151;color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:400;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.snack{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#000;color:#fff;border:1px solid #444;border-radius:8px;padding:14px 20px;display:flex;gap:20px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:410;max-width:92vw;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.snack.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.snack button{background:none;border:0;color:#7db3ff;font-weight:700;cursor:pointer;padding:2px 4px;white-space:nowrap}
.snack button:hover{text-decoration:underline}

@media(max-width:720px){
  #header{grid-template-columns:auto 1fr auto;gap:6px;padding:0 8px}
  .icon-btn{width:34px;height:34px}
  .logo img{height:calc(var(--hh) * 0.5)}
  .sec-grid,.v-grid{grid-template-columns:1fr}
  .art-wrap{grid-template-columns:1fr;gap:16px}
  .toc{position:static}
  .subbar{justify-content:flex-start}
  .h1{font-size:22px}
}
</style>
</head>
<body>

<header id="header">
  <div class="hdr-left">
    <a class="logo" href="#/" title="ホーム"><img id="hdrLogo" alt="MYwiki"></a>
    <button type="button" class="icon-btn" id="backBtn" title="1つ前のページに戻る" aria-label="戻る"></button>
  </div>
  <div id="hdrCenter"></div>
  <div class="hdr-right" id="hdrRight"></div>
</header>

<div id="subbar" class="subbar" hidden></div>
<main id="view"></main>
<div id="placeBanner" class="place-banner" hidden></div>
<div id="toast" class="toast"></div>

let toastTimer;

/* 黒い四角のお知らせ（右側にキャンセル付き） */
let snackTimer,snackAct=null;
function snack(msg,label,fn){
  const s=$('#snack');
  s.innerHTML='<span></span><button type="button"></button>';
  $('span',s).textContent=msg;
  const b=$('button',s);b.textContent=label;
  snackAct=fn;
  b.onclick=()=>{s.classList.remove('on');clearTimeout(snackTimer);const f=snackAct;snackAct=null;if(f)f()};
  s.classList.add('on');clearTimeout(snackTimer);
  snackTimer=setTimeout(()=>{s.classList.remove('on');snackAct=null},6000);
}

function textOf(html){return (new DOMParser().parseFromString('<body>'+html,'text/html').body.textContent||'').replace(/\s+/g,' ').trim()}
function sanitize(html){
  const doc=new DOMParser().parseFromString('<body>'+(html||''),'text/html');
  doc.body.querySelectorAll('script,iframe,object,embed,style,link,meta').forEach(n=>n.remove());
  doc.body.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(at=>{
    const nm=at.name.toLowerCase();
    if(nm.startsWith('on'))n.removeAttribute(at.name);
    else if((nm==='href'||nm==='src')&&/^\s*javascript:/i.test(at.value))n.removeAttribute(at.name);
  })});
  return doc.body.innerHTML;
}
const dateKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'})};
const collator=new Intl.Collator('ja',{numeric:true,sensitivity:'base'});

};

const DB={
  db:null,
  open(){return new Promise((ok,ng)=>{const q=indexedDB.open('mywiki',1);q.onupgradeneeded=()=>q.result.createObjectStore('articles',{keyPath:'id'});q.onsuccess=()=>{this.db=q.result;ok()};q.onerror=()=>ng(q.error)})},
  tx(mode,fn){return new Promise((ok,ng)=>{
    if(!this.db)return ok(undefined);
    const t=this.db.transaction('articles',mode);const r=fn(t.objectStore('articles'));
    t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ng(t.error);t.onabort=()=>ng(t.error);
  })},
  all(){return this.tx('readonly',s=>s.getAll())},
  put(a){return this.tx('readwrite',s=>s.put(a))},
  del(id){return this.tx('readwrite',s=>s.delete(id))}
};

function recentWords(n){const seen=new Set(),out=[];for(const h of [...hist].sort((a,b)=>b.t-a.t)){if(!seen.has(h.w)){seen.add(h.w);out.push(h.w);if(out.length>=n)break}}return out}
function addHistory(w){const d=dateKey(Date.now());hist=hist.filter(h=>!(h.w===w&&h.d===d));hist.push({i:uid(),w,d,t:Date.now()});if(hist.length>1000)hist=hist.slice(-1000);LS.set('mywiki.history',hist)}
function removeWord(w){hist=hist.filter(h=>h.w!==w);LS.set('mywiki.history',hist)}
function historyGroups(){const m=new Map();[...hist].sort((a,b)=>b.t-a.t).forEach(h=>{if(!m.has(h.d))m.set(h.d,[]);m.get(h.d).push(h)});return [...m.entries()].slice(0,5).map(([d,items])=>({d,items}))}

function toggleBM(id){
  const a=getArticle(id);if(!a)return;
  if(isBM(id)){
    const old=bms.find(b=>b.id===id);
    bms=bms.filter(b=>b.id!==id);saveBM();refreshStars();
    snack(a.title+'をブックマークから外しました','キャンセル',()=>{bms.push(old);saveBM();refreshStars()});
  }else{

    snack(a.title+'がブックマークに追加されました','キャンセル',()=>{bms=bms.filter(b=>b.id!==id);saveBM();refreshStars()});
  }
}
const SORTS=[['added','追加順'],['title','見出し順'],['opened','最近開いた順番']];
function sortedBM(){
  const list=bms.map(b=>({b,a:getArticle(b.id)})).filter(x=>x.a);
  const m=settings.bmSort||'added';
  if(m==='title')list.sort((x,y)=>collator.compare(x.a.title,y.a.title));
  else if(m==='opened')list.sort((x,y)=>(opened[y.a.id]||0)-(opened[x.a.id]||0)||y.b.t-x.b.t);
  else list.sort((x,y)=>y.b.t-x.b.t);
  return list;
}

let modal=null;
function openModal(node,onClose){
  closeModal();
  const back=document.createElement('div');back.className='modal-back';back.appendChild(node);document.body.appendChild(back);
  const onKey=e=>{if(e.key==='Escape')close()};
  const close=()=>{if(!modal||modal.back!==back)return;modal=null;back.remove();document.removeEventListener('keydown',onKey);if(onClose)onClose()};
  modal={back,close};
  back.addEventListener('mousedown',e=>{if(e.target===back)close()});
  document.addEventListener('keydown',onKey);
  const x=node.querySelector('.modal-x');if(x)x.addEventListener('click',close);
  return close;
}
function closeModal(){if(modal)modal.close()}
function confirmDialog({title,message,okText='OK',danger=false}){
  return new Promise(res=>{
    const box=document.createElement('div');box.className='modal-box';
    box.innerHTML=`<h3>${esc(title)}</h3><p>${esc(message)}</p><div class="row end"><button class="btn" data-r="0">キャンセル</button><button class="btn ${danger?'danger':'primary'}" data-r="1">${esc(okText)}</button></div>`;
    let done=false;
    const close=openModal(box,()=>{if(!done){done=true;res(false)}});
    box.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;done=true;close();res(b.dataset.r==='1')});
  });
}

let hdrSearch;
function buildSearch(big){
  const el=document.createElement('div');el.className='search-wrap'+(big?' big':'');
  el.innerHTML=`<div class="search-box"><button type="button" class="s-btn" title="検索">${ic('search')}</button><input class="s-input" type="text" placeholder="MYwikiを検索" autocomplete="off" enterkeyhint="search"><div class="s-dd" hidden></div></div>`;
  const input=$('.s-input',el),dd=$('.s-dd',el);
  /* 文字が入力されている間は検索結果（最大3件）、空のときは検索履歴（最大5件） */
  const renderDD=()=>{
    const q=input.value.trim();
    if(q){
      const res=searchArticles(q).slice(0,3);
      dd.innerHTML=res.length
        ?res.map(r=>`<div class="dd-row" data-a="${r.a.id}"><span class="dd-w">${esc(r.a.title)}</span></div>`).join('')
        :'<div class="dd-none">検索結果なし</div>';
      dd.hidden=false;return;
    }
    const items=recentWords(5);
    if(!items.length){dd.hidden=true;return}
    dd.innerHTML=items.map(w=>`<div class="dd-row" data-w="${esc(w)}"><span class="dd-w">${esc(w)}</span><button type="button" class="dd-x" title="履歴から削除">${ic('x',16)}</button></div>`).join('');
    dd.hidden=false;
  };
  dd.addEventListener('click',e=>{
    const row=e.target.closest('.dd-row');if(!row)return;
    if(row.dataset.a){
      const a=getArticle(row.dataset.a);if(!a)return;
      dd.hidden=true;addHistory(a.title);navigate('#/article/'+a.id);return;
    }
    const w=row.dataset.w;
    if(e.target.closest('.dd-x')){removeWord(w);renderDD();input.focus()}
    else{input.value=w;dd.hidden=true;doSearch(w)}
  });
  input.addEventListener('focus',renderDD);
  input.addEventListener('click',renderDD);
  input.addEventListener('input',renderDD);
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){if(e.isComposing||e.keyCode===229)return;e.preventDefault();dd.hidden=true;doSearch(input.value)}
    else if(e.key==='Escape')dd.hidden=true;
  });
  $('.s-btn',el).addEventListener('click',()=>{dd.hidden=true;doSearch(input.value)});
  return {el,input,dd};
}
document.addEventListener('click',e=>{
  const path=e.composedPath();
  $$('.search-wrap').forEach(w=>{if(!path.includes(w))$('.s-dd',w).hidden=true});
});
function doSearch(q){
  q=(q||'').trim();
  if(!q){navigate('#/');return}
  addHistory(q);
  navigate('#/search/'+encodeURIComponent(q));
}
function openHistoryWord(w){
  addHistory(w);
  const a=state.articles.find(x=>x.title===w);
  navigate(a?'#/article/'+a.id:'#/search/'+encodeURIComponent(w));
}
function searchArticles(q){
  const k=q.toLowerCase(),out=[];
  for(const a of state.articles){
    const t=a.title.toLowerCase();let score=99,snippet='';
    if(t===k)score=0;else if(t.includes(k))score=1;
    if(score>1&&a.sections.some(s=>s.heading.toLowerCase().includes(k)))score=2;
    const body=a.sections.map(s=>textOf(s.html)).join(' ');
    const bi=body.toLowerCase().indexOf(k);
    if(bi>=0){if(score>3)score=3;snippet=(bi>30?'…':'')+body.slice(Math.max(0,bi-30),bi+90)+(body.length>bi+90?'…':'')}
    if(score<99)out.push({a,score,snippet});
  }
  return out.sort((x,y)=>x.score-y.score||collator.compare(x.a.title,y.a.title));
}

}
function updateBack(){const b=$('#backBtn');if(b)b.disabled=curDepth<=0}
window.addEventListener('hashchange',()=>{
  const rep=pendingReplace;pendingReplace=false;
  const st=history.state;
  const d=rep?curDepth:(st&&typeof st.d==='number'?st.d:curDepth+1);
  try{history.replaceState({d},'')}catch{}
  if(guardSkip){guardSkip=false;updateBack();return}
  if(isDirty()&&!confirm('保存されていない変更があります。破棄して移動しますか？')){guardSkip=true;pendingReplace=true;location.replace(lastHash);return}
  curDepth=d;lastHash=location.hash||'#/';updateBack();
  route();
});

    :'<div class="empty">履歴はありません</div>'}</div>`;

/* ---------- ブックマークページ ---------- */
function renderBookmarks(){
  setTitle('ブックマーク -MYwiki');
  const list=sortedBM();
  const cur=settings.bmSort||'added';
  $('#view').innerHTML=`<div class="page"><div class="page-head"><h1 class="h1">ブックマーク</h1>${list.length||bmDel?delBar('bm'):''}</div>${
    list.length?`<div class="sort-row"><button class="btn" data-act="sort-toggle">並べ替え</button>${bmSortOpen?SORTS.map(([v,n])=>`<button class="btn sort-opt${cur===v?' on':''}" data-act="sort" data-v="${v}">${cur===v?'✓ ':''}${n}</button>`).join(''):''}</div>
    <ul class="bm-list">${list.map(({a})=>`<li class="h-item">${bmDel?`<input type="checkbox" class="chk" data-act="bm-item" data-i="${a.id}" ${bmSel.has(a.id)?'checked':''}>`:''}<a class="h-word" href="#/article/${a.id}"><span class="bs">${ic('star',16,true)}</span><span>${esc(a.title)}</span></a></li>`).join('')}</ul>`
    :'<div class="empty">ブックマークはありません</div>'}</div>`;
}

/* ---------- 設定 ---------- */
function renderSettings(){
  setTitle('設定 -MYwiki');
  $('#view').innerHTML=`<div class="page"><h1 class="h1" style="margin-bottom:16px">設定</h1><div class="card pad"><div class="set-t">背景の色</div><div class="theme-opts"><button class="theme-opt ${settings.theme==='light'?'on':''}" data-act="theme" data-v="light"><span class="sw light"></span>白</button><button class="theme-opt ${settings.theme==='dark'?'on':''}" data-act="theme" data-v="dark"><span class="sw dark"></span>黒</button></div><p class="hint">変更は自動的にこのブラウザへ保存されます。</p></div></div>`;
}

/* ================= エディタ（作成・編集） ================= */
let ed=null;
const newSection=()=>({sid:uid(),heading:'',html:'',media:[]});
const clone=a=>({id:a.id,title:a.title,sections:a.sections.map(s=>({sid:s.sid,heading:s.heading,html:s.html,media:s.media.map(m=>({...m}))}))});
const sig=a=>JSON.stringify([a.title,a.sections.map(s=>[s.sid,s.heading,s.html,s.media.map(m=>[m.mid,m.caption])])]);

function renderNew(t){startEditor({id:null,title:t||'',sections:[]},true);setTitle('ページ作成 -MYwiki')}
function renderEdit(id){const a=getArticle(id);if(!a)return renderNotFound();startEditor(a,false);setTitle(a.title+'を編集 -MYwiki')}
function startEditor(a,isNew){
  ed={isNew,a:clone(a),stack:[],idx:0,timer:null,lastRange:null,placing:null,saved:false};
  ed.a.sections.forEach(s=>s.html=sanitize(s.html));
  ed.stack=[{a:clone(ed.a),s:sig(ed.a)}];ed.initSig=ed.stack[0].s;
  document.body.classList.add('editing');$('#subbar').hidden=false;
  renderEditor();
}
function isDirty(){if(!ed||ed.saved)return false;syncFromDOM();return sig(ed.a)!==ed.initSig}

function mediaHTML(m){
  if(m.type==='image')return `<figure class="media img${m.caption!==null?' has-cap':''}" data-mid="${m.mid}" style="margin:0"><div class="img-wrap"><img src="${m.src}" alt="" data-act="img-sel"><button class="m-del" data-act="m-del" title="削除">${ic('x',14)}</button><button class="m-cap" data-act="m-cap">説明を追加</button></div>${m.caption!==null?`<input class="cap-input" data-mid="${m.mid}" placeholder="説明を入力" autocomplete="off">`:''}</figure>`;
  return `<div class="media aud" data-mid="${m.mid}"><button class="m-del" data-act="m-del" title="削除">${ic('x',14)}</button><div class="fname">${esc(m.name)}</div><audio controls src="${m.src}"></audio></div>`;
}
function mediaColHTML(s,i){
  const slot=j=>ed.placing?`<button class="slot" data-act="slot" data-sec="${i}" data-pos="${j}">ここに設置</button>`:'';
  let h='';s.media.forEach((m,j)=>{h+=slot(j)+mediaHTML(m)});h+=slot(s.media.length);
  return h||'<div class="media-empty">画像・音声</div>';
}
const secHTML=(s,i)=>`<div class="card section" data-i="${i}"><div class="sec-top"><span class="sec-no">目次セクション ${i+1}</span><button class="sec-del" data-act="sec-del" title="このセクションを削除">${ic('trash',18)}</button></div><div class="sec-grid"><div class="sec-left"><label class="lbl">目次を入力</label><input class="sec-heading" type="text" autocomplete="off"><label class="lbl">テキストを入力</label><div class="rich" contenteditable="true" spellcheck="false"></div></div><div class="sec-right">${mediaColHTML(s,i)}</div></div></div>`;

function renderEditor(){
  const y=window.scrollY,a=ed.a;
  $('#view').innerHTML=`<div class="page" id="editor"><div class="page-head"><h1 class="h1">${ed.isNew?'ページを作成':'ページを編集'}</h1><div class="head-btns"><button class="btn" data-act="cancel">キャンセル</button><button class="btn primary" data-act="save">保存する</button></div></div><div class="field-label">見出し</div><div class="card"><input id="titleInput" class="title-input" type="text" autocomplete="off"></div><div id="secs">${a.sections.map(secHTML).join('')}</div><button class="add-sec" data-act="add-sec">${ic('plus',20)} 目次を追加</button></div>`;
  $('#titleInput').value=a.title;
  $$('.section').forEach((el,i)=>{
    const s=a.sections[i];
    $('.sec-heading',el).value=s.heading;
    $('.rich',el).innerHTML=s.html;
    $$('.cap-input',el).forEach(inp=>{const m=s.media.find(m=>m.mid===inp.dataset.mid);inp.value=(m&&m.caption)||''});
  });
  window.scrollTo(0,y);ed.lastRange=null;updatePlaceBanner();updateUndoBtns();
}
function syncFromDOM(){
  if(!ed||!$('#editor'))return;
  ed.a.title=$('#titleInput').value;
  $$('#editor .section').forEach((el,i)=>{
    const s=ed.a.sections[i];if(!s)return;
    s.heading=$('.sec-heading',el).value;
    s.html=$('.rich',el).innerHTML;
    $$('.cap-input',el).forEach(inp=>{const m=s.media.find(m=>m.mid===inp.dataset.mid);if(m)m.caption=inp.value});
  });
}

/* ---- 元に戻す / やり直す ---- */
function commit(){
  if(!ed)return;
  clearTimeout(ed.timer);syncFromDOM();
  const s=sig(ed.a);
  if(s!==ed.stack[ed.idx].s){
    ed.stack=ed.stack.slice(0,ed.idx+1);ed.stack.push({a:clone(ed.a),s});
    if(ed.stack.length>200)ed.stack.shift();
    ed.idx=ed.stack.length-1;
  }
  updateUndoBtns();
}
const commitSoon=()=>{if(!ed)return;clearTimeout(ed.timer);ed.timer=setTimeout(commit,600)};
function loadState(){ed.a=clone(ed.stack[ed.idx].a);ed.placing=null;renderEditor()}
function undo(){if(!ed)return;commit();if(ed.idx>0){ed.idx--;loadState()}}
function redo(){if(!ed)return;commit();if(ed.idx<ed.stack.length-1){ed.idx++;loadState()}}
function updateUndoBtns(){
  const u=$('[data-act="tb-undo"]'),r=$('[data-act="tb-redo"]');if(!u||!r)return;
  u.disabled=!ed||ed.idx===0;r.disabled=!ed||ed.idx>=ed.stack.length-1;
}

/* ---- 保存 ---- */
async function saveEditor(){
  if(!ed)return;
  commit();const a=ed.a;const title=a.title.trim();
  if(!title){toast('見出しを入力してください');$('#titleInput').focus();return}
  if(state.articles.some(x=>x.id!==a.id&&x.title===title)){toast('同じ見出しの記事がすでにあります');return}
  const id=a.id||uid();const old=getArticle(id);
  const rec={id,title,created:old?old.created:Date.now(),updated:Date.now(),
    sections:a.sections.map(s=>({sid:s.sid,heading:s.heading,html:sanitize(s.html),media:s.media.map(m=>({...m}))}))};
  try{await DB.put(rec)}catch{toast('保存に失敗しました（容量不足の可能性があります）');return}
  const i=state.articles.findIndex(x=>x.id===id);
  if(i>=0)state.articles[i]=rec;else state.articles.push(rec);
  ed.saved=true;toast('保存しました');
  navigate('#/article/'+id,true);
}
function cancelEditor(){
  if(!ed)return;
  if(curDepth>0)history.back();
  else navigate(ed.isNew?'#/':'#/article/'+ed.a.id,true);
}

/* ---- 画像・音声 ---- */
function pickFile(type){
  if(!ed.a.sections.length){toast('先に「目次を追加」を押してセクションを作ってください');return}
  const inp=document.createElement('input');inp.type='file';inp.accept=type==='image'?'image/*':'audio/*';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    if(f.size>50*1024*1024){toast('ファイルが大きすぎます（50MBまで）');return}
    const fr=new FileReader();
    fr.onload=()=>{
      commit();
      ed.placing={item:{mid:uid(),type,name:f.name,src:fr.result,caption:null}};
      renderEditor();toast('設置したい場所の「ここに設置」を押してください');
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}
function placeMedia(si,pos){
  if(!ed||!ed.placing)return;
  commit();
  ed.a.sections[si].media.splice(pos,0,ed.placing.item);
  ed.placing=null;renderEditor();commit();
}
function updatePlaceBanner(){
  const b=$('#placeBanner');
  if(ed&&ed.placing){b.hidden=false;b.innerHTML=`${ed.placing.item.type==='image'?'画像':'音声'}を置く場所の「ここに設置」を押してください <button class="btn" id="placeCancel">キャンセル</button>`}
  else b.hidden=true;
}
$('#placeBanner').addEventListener('click',e=>{if(e.target.closest('#placeCancel')&&ed){ed.placing=null;renderEditor()}});

/* ---- 本文内の位置（キャレット）管理 ---- */
document.addEventListener('selectionchange',()=>{
  if(!ed)return;
  const s=getSelection();if(!s.rangeCount)return;
  const r=s.getRangeAt(0),n=r.commonAncestorContainer,el=n.nodeType===1?n:n.parentElement;
  if(el&&el.closest&&el.closest('#editor .rich'))ed.lastRange=r.cloneRange();
});
function getRange(){
  const r=ed&&ed.lastRange;if(!r)return null;
  if(!document.body.contains(r.startContainer))return null;
  return r;
}
const richOf=r=>(r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement).closest('.rich');

/* ---- URL挿入 ---- */
function normUrl(s){
  s=(s||'').trim();if(!s)return null;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(s))s='https://'+s;
  try{const u=new URL(s);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}
}
function openUrlModal(){
  if(!getRange()){toast('先に、リンクを入れたい本文中の位置をクリックしてください');return}
  const box=document.createElement('div');box.className='modal-box square';
  box.innerHTML=`<button class="modal-x icon-btn" aria-label="閉じる">${ic('x')}</button><div><input id="uWiki" class="m-input" placeholder="MYwiki内を検索" autocomplete="off"><div id="uRes" class="u-res"></div></div><div class="row"><input id="uUrl" class="m-input" placeholder="URLを入力" autocomplete="off"><button class="btn primary" id="uGo">挿入</button></div>`;
  const close=openModal(box);
  const res=$('#uRes',box),q=$('#uWiki',box);
  const draw=()=>{
    const k=q.value.trim().toLowerCase();
    const list=sortedArticles().filter(a=>a.id!==ed.a.id&&(!k||a.title.toLowerCase().includes(k))).slice(0,6);
    res.innerHTML=list.length?list.map(a=>`<button class="u-item" data-id="${a.id}">${esc(a.title)}</button>`).join(''):'<div class="u-none">該当する記事がありません</div>';
  };
  draw();q.addEventListener('input',draw);
  res.addEventListener('click',e=>{const b=e.target.closest('.u-item');if(!b)return;const a=getArticle(b.dataset.id);close();insertLink('#/article/'+a.id,a.title,a.id)});
  const go=()=>{const u=normUrl($('#uUrl',box).value);if(!u){toast('正しいURLを入力してください（http / https）');return}close();insertLink(u,u,null)};
  $('#uGo',box).addEventListener('click',go);
  $('#uUrl',box).addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();go()}});
  q.focus();
}
function insertLink(href,label,wikiId){
  const r=getRange();if(!r){toast('挿入位置が見つかりません');return}
  const rich=richOf(r);rich.focus();
  const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
  const a=document.createElement('a');a.href=href;
  if(wikiId){a.dataset.wiki=wikiId;a.textContent=label}
  else{a.target='_blank';a.rel='noopener noreferrer';a.textContent=(!r.collapsed&&r.toString())||label}
  r.deleteContents();r.insertNode(a);
  const sp=document.createTextNode('\u00A0');a.after(sp);
  const nr=document.createRange();nr.setStart(sp,1);nr.collapse(true);
  sel.removeAllRanges();sel.addRange(nr);ed.lastRange=nr.cloneRange();
  commit();
}

/* ---- 文字の色 ---- */
const COLORS=[['緑','#16a34a','#fff'],['黄','#eab308','#111'],['赤','#dc2626','#fff'],['青','#2563eb','#fff'],['黒','#000000','#fff']];
function openColorModal(){
  if(!getRange()){toast('先に、文字を入力したい本文中の位置をクリックしてください');return}
  const box=document.createElement('div');box.className='modal-box square';
  box.innerHTML=`<button class="modal-x icon-btn" aria-label="閉じる">${ic('x')}</button><div class="color-grid">${COLORS.map(([n,c,t])=>`<button class="color-btn" data-c="${c}" style="background:${c};color:${t}">${n}</button>`).join('')}</div>`;
  const close=openModal(box);
  box.addEventListener('click',e=>{const b=e.target.closest('.color-btn');if(!b)return;close();applyColor(b.dataset.c)});
}
function applyColor(c){
  const r=getRange();if(!r)return;
  const rich=richOf(r);rich.focus();
  const s=getSelection();s.removeAllRanges();s.addRange(r);
  document.execCommand('styleWithCSS',false,true);
  document.execCommand('foreColor',false,c);
  const s2=getSelection();if(s2.rangeCount)ed.lastRange=s2.getRangeAt(0).cloneRange();
  commitSoon();
}

/* ================= イベント ================= */
const view=$('#view');
view.addEventListener('click',e=>{
  if(ed&&!e.target.closest('.media.img'))$$('.media.img.selected').forEach(x=>x.classList.remove('selected'));
  if(ed&&e.target.closest('.rich a'))e.preventDefault();
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  switch(act){
    case 'toggle-list':toggleList();break;
    case 'del-article':deleteArticle(el.dataset.id);break;
    case 'bm-toggle':toggleBM(el.dataset.id);break;
    case 'goto':{const s=document.getElementById('sec-'+el.dataset.i);if(s)s.scrollIntoView({behavior:'smooth',block:'start'});break}
    case 'h-open':openHistoryWord(el.dataset.w);break;
    case 'theme':settings.theme=el.dataset.v;LS.set('mywiki.settings',settings);applyTheme();renderSettings();toast('設定を保存しました');break;
    /* 削除モード（履歴・ブックマーク共通） */
    case 'del-mode':
      if(el.dataset.k==='hist'){histDel=true;histSel.clear();renderHistory()}
      else{bmDel=true;bmSel.clear();renderBookmarks()}
      break;
    case 'del-cancel':
      if(el.dataset.k==='hist'){histDel=false;histSel.clear();renderHistory()}
      else{bmDel=false;bmSel.clear();renderBookmarks()}
      break;
    case 'del-exec':
      if(el.dataset.k==='hist'){
        if(!histSel.size)break;
        hist=hist.filter(h=>!histSel.has(h.i));LS.set('mywiki.history',hist);
        histDel=false;histSel.clear();renderHistory();
      }else{
        if(!bmSel.size)break;
        bms=bms.filter(b=>!bmSel.has(b.id));saveBM();
        bmDel=false;bmSel.clear();renderBookmarks();
      }
      toast('削除しました');break;
    /* ブックマークの並べ替え */
    case 'sort-toggle':bmSortOpen=!bmSortOpen;renderBookmarks();break;
    case 'sort':settings.bmSort=el.dataset.v;LS.set('mywiki.settings',settings);renderBookmarks();break;
    /* エディタ */
    case 'save':saveEditor();break;
    case 'cancel':cancelEditor();break;
    case 'add-sec':if(!ed)break;commit();ed.a.sections.push(newSection());renderEditor();commit();break;
    case 'sec-del':{if(!ed)break;const i=+el.closest('.section').dataset.i;commit();ed.a.sections.splice(i,1);renderEditor();commit();break}
    case 'slot':placeMedia(+el.dataset.sec,+el.dataset.pos);break;
    case 'm-del':{
      if(!ed)break;const mid=el.closest('[data-mid]').dataset.mid,i=+el.closest('.section').dataset.i;
      commit();const s=ed.a.sections[i];s.media=s.media.filter(m=>m.mid!==mid);renderEditor();commit();break}
    case 'm-cap':{
      if(!ed)break;const mid=el.closest('[data-mid]').dataset.mid,i=+el.closest('.section').dataset.i;
      commit();const m=ed.a.sections[i].media.find(m=>m.mid===mid);if(m)m.caption='';
      renderEditor();commit();const inp=$(`.cap-input[data-mid="${mid}"]`);if(inp)inp.focus();break}
    case 'img-sel':{
      const fig=el.closest('.media.img');const was=fig.classList.contains('selected');
      $$('.media.img.selected').forEach(x=>x.classList.remove('selected'));
      if(!was)fig.classList.add('selected');break}
  }
});
/* チェックボックス（チェックしただけでは削除されない。「削除する」ボタンで実行） */
view.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const y=window.scrollY;
  switch(el.dataset.act){
    case 'rm-item':el.checked?histSel.add(el.dataset.i):histSel.delete(el.dataset.i);renderHistory();break;
    case 'rm-date':{
      const g=historyGroups().find(g=>g.d===el.dataset.d);
      if(g)g.items.forEach(it=>el.checked?histSel.add(it.i):histSel.delete(it.i));
      renderHistory();break}
    case 'bm-item':el.checked?bmSel.add(el.dataset.i):bmSel.delete(el.dataset.i);renderBookmarks();break;
    default:return;
  }
  window.scrollTo(0,y);
});
view.addEventListener('input',e=>{if(ed&&e.target.closest('.rich,.sec-heading,#titleInput,.cap-input'))commitSoon()});
view.addEventListener('paste',e=>{
  if(!ed||!e.target.closest('.rich'))return;
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
});
view.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('.rich'))e.preventDefault()});

/* サブバー */
$('#subbar').innerHTML=`
  <button class="tb" data-act="tb-url">${ic('link',18)}URL</button>
  <button class="tb" data-act="tb-image">${ic('image',18)}画像</button>
  <button class="tb" data-act="tb-audio">${ic('mic',18)}音声</button>
  <button class="tb" data-act="tb-color">${ic('palette',18)}文字の色</button>
  <span class="tb-sep"></span>
  <button class="tb" data-act="tb-undo" title="元に戻す (Ctrl+Z)" aria-label="左矢印（元に戻す）">${ic('left',18)}</button>
  <button class="tb" data-act="tb-redo" title="やり直す (Ctrl+Y)" aria-label="右矢印（やり直す）">${ic('right',18)}</button>`;
$('#subbar').addEventListener('mousedown',e=>e.preventDefault());   // 本文の選択位置を保持
$('#subbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||!ed)return;
  switch(b.dataset.act){
    case 'tb-url':openUrlModal();break;
    case 'tb-image':pickFile('image');break;
    case 'tb-audio':pickFile('audio');break;
    case 'tb-color':openColorModal();break;
    case 'tb-undo':undo();break;
    case 'tb-redo':redo();break;
  }
});

/* キーボード：Ctrl+Z / Ctrl+Y / Ctrl+S */
document.addEventListener('keydown',e=>{
  if(!ed)return;
  const mod=e.ctrlKey||e.metaKey;if(!mod)return;
  if(e.target.closest&&(e.target.closest('#header')||e.target.closest('.modal-back')))return;
  const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();undo()}
  else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo()}
  else if(k==='s'){e.preventDefault();saveEditor()}
});
document.addEventListener('beforeinput',e=>{
  if(ed&&(e.inputType==='historyUndo'||e.inputType==='historyRedo')&&!(e.target.closest&&e.target.closest('#header')))e.preventDefault();
});

/* ヘッダーのスクロール表示切り替え */
let lastY=0;
const hasOpenDD=()=>$$('.s-dd').some(d=>!d.hidden);
function hideHeader(){$('#header').classList.add('hide');document.body.classList.add('hdr-hidden')}
function showHeader(){$('#header').classList.remove('hide');document.body.classList.remove('hdr-hidden')}
window.addEventListener('scroll',()=>{
  const y=window.scrollY;
  if(Math.abs(y-lastY)<6)return;
  if(y>lastY&&y>60){if(!hasOpenDD())hideHeader()}else showHeader();
  lastY=y;
},{passive:true});

/* ================= 起動 ================= */
(async function init(){
  applyTheme();
  $('#hdrLogo').src=LOGO;
  $('#backBtn').innerHTML=ic('left');
  $('#backBtn').addEventListener('click',()=>{if(curDepth>0)history.back()});
  const st0=history.state;
  if(st0&&typeof st0.d==='number')curDepth=st0.d;
  else{try{history.replaceState({d:0},'')}catch{}}
  updateBack();
  $('#hdrRight').innerHTML=
    `<a class="icon-btn" href="#/new" title="ページ作成">${ic('plus')}</a>`+
    `<a class="icon-btn" href="#/bookmarks" title="ブックマーク">${ic('star')}</a>`+
    `<a class="icon-btn" href="#/history" title="履歴">${ic('clock')}</a>`+
    `<a class="icon-btn" href="#/settings" title="設定">${ic('gear')}</a>`;
  hdrSearch=buildSearch(false);$('#hdrCenter').appendChild(hdrSearch.el);
  try{await DB.open();state.articles=(await DB.all())||[];if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
  catch{toast('記事の保存領域を開けませんでした（このセッションのみ有効）')}
  route();
})();
</script>
